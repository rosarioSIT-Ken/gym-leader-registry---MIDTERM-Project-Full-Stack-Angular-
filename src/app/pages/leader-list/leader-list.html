<section class="page">
  <header class="head">
    <div>
      <p class="kicker">The Registry</p>
      <h1>Gym Leaders</h1>
    </div>
    <span class="count">{{ filteredLeaders().length }} leader(s)</span>
  </header>

  <div class="filters">
    @for (region of regions; track region) {
      <button type="button" [class.active]="selectedRegion() === region" (click)="selectRegion(region)">
        {{ region }}
      </button>
    }
  </div>
</section>

<div class="viewport">
  <button type="button" class="arrow left" [disabled]="atStart()" (click)="scroll(-1)" aria-label="Previous">&#8592;</button>

  <div class="track" #track (scroll)="updateArrows()">
    @for (leader of filteredLeaders(); track leader._id) {
      <div class="slide">
        <app-leader-card [leader]="leader" (edit)="onEdit($event)" (remove)="onRemove($event)" />
      </div>
    } @empty {
      <div class="empty">
        <p>No Gym Leaders registered yet.</p>
        <a routerLink="/leaders/new" class="ghost">+ Add Leader</a>
      </div>
    }
  </div>

  <button type="button" class="arrow right" [disabled]="atEnd()" (click)="scroll(1)" aria-label="Next">&#8594;</button>
</div>
