<article
  class="panel"
  [class.kanto]="leader().region === 'Kanto'"
  [class.johto]="leader().region === 'Johto'"
  [class.hoenn]="leader().region === 'Hoenn'"
>
  <div class="art">
    @if (imageFailed()) {
      <div class="placeholder">
        <span class="ph-letter">{{ initial() }}</span>
        <span class="ph-note">{{ leader().specialty }} type</span>
      </div>
    } @else {
      <img [src]="imagePath()" [alt]="leader().name" (error)="onImageError()" />
    }
  </div>

  <span class="tag">{{ leader().region }}</span>
  <span class="level">Ace Lv. {{ leader().aceLevel }}</span>

  <div class="overlay">
    <div class="meta">
      <h3>{{ leader().name }}</h3>
      <p class="sub">{{ leader().specialty }} &middot; {{ leader().town }}</p>
      <p class="badge">{{ leader().badge }}</p>

      @if (leader().motto) {
        <p class="motto">"{{ leader().motto }}"</p>
      }
    </div>

    <div class="actions">
      <button type="button" class="edit-btn" (click)="onEdit()">Edit</button>
      <button type="button" class="remove-btn" (click)="onRemove()">Remove</button>
    </div>
  </div>
</article>
